name: lint

on:
  push:
    branches: [master, main, add-red-bucket-mvp]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install lint tools
        run: python -m pip install -e ".[dev]" semgrep
      - name: make lint
        run: make lint
        env:
          # CI 用系统 python3.12；Makefile 默认走 uv
          PY: python3
      - name: make test
        run: make test
